<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolución intercensal de la población</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Segoe UI',Arial,sans-serif;
  background:#f7f8fa;
  padding:24px;
}
.card{
  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 16px rgba(0,0,0,.08);
  padding:24px 28px;
  max-width:760px;
  width:100%;
}
.titulo{
  font-size:1.25rem;
  font-weight:700;
  color:#1a1a2e;
  margin-bottom:4px;
}
.subtitulo{
  font-size:.85rem;
  color:#888;
  margin-bottom:18px;
}
.chart-container{
  position:relative;
  height:260px;
}
</style>
</head>
<body>

<div class="card">
  <div class="titulo">Evolución intercensal de la población</div>
  <div class="subtitulo">Población total por censo</div>

  <div class="chart-container">
    <canvas id="grafico"></canvas>
  </div>
</div>

<script>
const valores=[121620,110993,115041,127160];

const labelsPlugin={
 id:'labelsPlugin',
 afterDatasetsDraw(chart){
   const {ctx}=chart;
   const meta=chart.getDatasetMeta(0);

   meta.data.forEach((point,i)=>{
      ctx.save();
      ctx.fillStyle='#666';
      ctx.font='12px Segoe UI';
      ctx.textAlign='center';
      ctx.fillText(
        valores[i].toLocaleString('es-AR'),
        point.x,
        point.y-12
      );
      ctx.restore();
   });
 }
};

new Chart(document.getElementById('grafico'),{
 type:'line',
 data:{
   labels:['1991','2001','2010','2022'],
   datasets:[{
      data:valores,
      borderColor:'#4DAEB6',
      backgroundColor:'rgba(77,174,182,0.35)',
      fill:true,
      tension:0.25,
      borderWidth:3,
      pointRadius:4,
      pointHoverRadius:6
   }]
 },
 options:{
   responsive:true,
   maintainAspectRatio:false,
   plugins:{
      legend:{display:false},
      tooltip:{
        callbacks:{
          label:(ctx)=>ctx.raw.toLocaleString('es-AR')+' habitantes'
        }
      }
   },
   scales:{
      y:{
        title:{
          display:true,
          text:'Población total'
        },
        grid:{
          borderDash:[3,3]
        },
        ticks:{
          callback:(v)=>v.toLocaleString('es-AR')
        }
      },
      x:{
        title:{
          display:true,
          text:'Año'
        },
        grid:{
          display:false
        }
      }
   }
 },
 plugins:[labelsPlugin]
});
</script>

</body>
</html>
